name: Naver Keyword Bot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  send-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Run keyword bot
        run: |
          pip install requests
          python - <<'EOF'
          import requests
          import time
          import hmac
          import hashlib
          import base64
          from datetime import datetime

          ACCESS_LICENSE = "${{ secrets.NAVER_AD_LICENSE }}"
          SECRET_KEY = "${{ secrets.NAVER_AD_SECRET }}"
          CUSTOMER_ID = "${{ secrets.NAVER_CUSTOMER_ID }}"

          timestamp = str(int(time.time() * 1000))
          path = "/keywordstool"
          method = "GET"
          message = f"{timestamp}.{method}.{path}"
          signature = hmac.new(SECRET_KEY.encode(), message.encode(), hashlib.sha256)
          sig = base64.b64encode(signature.digest()).decode()

          headers = {
              "X-Timestamp": timestamp,
              "X-API-KEY": ACCESS_LICENSE,
              "X-Customer": CUSTOMER_ID,
              "X-Signature": sig
          }

          categories = [
              "뷰티", "패션", "맛집", "여행", "축제",
              "금융", "경제", "주식", "방송", "상품"
          ]

          message_text = f"📊 오늘의 네이버 인기 키워드\n({datetime.now().strftime('%Y-%m-%d')})\n\n"

          for kw in categories:
              res = requests.get(
                  f"https://api.naver.com/keywordstool?hintKeywords={kw}&showDetail=1",
                  headers=headers
              )
              data = res.json()
              items = data.get("keywordList", [])[:10]
              message_text += f"🔹 {kw} 관련 TOP 10\n"
              for item in items:
                  name = item.get("relKeyword", "")
                  count = item.get("monthlyPcQcCnt", 0)
                  message_text += f"  • {name}: {count}회\n"
              message_text += "\n"

          token = "${{ secrets.TELEGRAM_TOKEN }}"
          chat_id = "${{ secrets.CHAT_ID }}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"

          # 메시지가 길면 나눠서 전송
          chunk_size = 4000
          for i in range(0, len(message_text), chunk_size):
              chunk = message_text[i:i+chunk_size]
              requests.post(url, json={"chat_id": chat_id, "text": chunk})
              time.sleep(1)

          print("전송 완료!")
          EOF
