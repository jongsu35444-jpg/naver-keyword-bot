name: Naver Keyword Bot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  send-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Run keyword bot
        run: |
          pip install requests
          python - <<'EOF'
          import requests
          import time
          from datetime import datetime
          from collections import Counter
          import re

          CLIENT_ID = "${{ secrets.NAVER_CLIENT_ID }}"
          CLIENT_SECRET = "${{ secrets.NAVER_CLIENT_SECRET }}"

          headers = {
              "X-Naver-Client-Id": CLIENT_ID,
              "X-Naver-Client-Secret": CLIENT_SECRET
          }

          categories = {
              "여행": "여행 국내여행 해외여행",
              "축제": "축제 지역축제 페스티벌",
              "금융": "대출 금리 적금 예금",
              "경제": "경제 부동산 물가 환율",
              "주식": "주식 코스피 나스닥 ETF",
              "방송": "드라마 예능 넷플릭스 영화",
              "상품": "신상품 할인 쿠팡 쇼핑",
              "뷰티": "화장품 스킨케어 뷰티 선크림",
              "패션": "패션 옷 신발 코디",
              "맛집": "맛집 카페 음식 배달"
          }

          message_text = f"📊 오늘의 네이버 뉴스 핫 키워드\n({datetime.now().strftime('%Y-%m-%d')})\n\n"

          for category, query in categories.items():
              all_keywords = []
              for q in query.split():
                  res = requests.get(
                      f"https://openapi.naver.com/v1/search/news.json?query={q}&display=20&sort=date",
                      headers=headers
                  )
                  data = res.json()
                  items = data.get("items", [])
                  for item in items:
                      title = re.sub(r'<[^>]+>', '', item.get("title", ""))
                      words = re.findall(r'[가-힣]{2,8}', title)
                      all_keywords.extend(words)
                  time.sleep(0.3)

              stopwords = ["있다", "없다", "이번", "지난", "올해", "최근", "대한", "위한", "통해", "함께", "대해", "오늘", "내일", "이후", "이전", "관련", "개최", "진행", "예정", "발표", "공개"]
              filtered = [w for w in all_keywords if w not in stopwords]
              top_keywords = Counter(filtered).most_common(10)

              message_text += f"🔹 {category} TOP 10\n"
              for kw, count in top_keywords:
                  message_text += f"  • {kw} ({count}회 언급)\n"
              message_text += "\n"

          token = "${{ secrets.TELEGRAM_TOKEN }}"
          chat_id = "${{ secrets.CHAT_ID }}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"

          chunk_size = 4000
          for i in range(0, len(message_text), chunk_size):
              chunk = message_text[i:i+chunk_size]
              requests.post(url, json={"chat_id": chat_id, "text": chunk})
              time.sleep(1)

          print("전송 완료!")
          EOF
