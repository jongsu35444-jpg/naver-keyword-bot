name: Naver Keyword Bot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  send-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Run keyword bot
        run: |
          pip install requests
          python - <<'EOF'
          import requests
          import time
          import hmac
          import hashlib
          import base64
          from datetime import datetime

          ACCESS_LICENSE = "${{ secrets.NAVER_AD_LICENSE }}"
          SECRET_KEY = "${{ secrets.NAVER_AD_SECRET }}"
          CUSTOMER_ID = "${{ secrets.NAVER_CUSTOMER_ID }}"

          def get_ad_headers():
              timestamp = str(int(time.time() * 1000))
              path = "/keywordstool"
              method = "GET"
              msg = f"{timestamp}.{method}.{path}"
              signature = hmac.new(SECRET_KEY.encode(), msg.encode(), hashlib.sha256)
              sig = base64.b64encode(signature.digest()).decode()
              return {
                  "X-Timestamp": timestamp,
                  "X-API-KEY": ACCESS_LICENSE,
                  "X-Customer": CUSTOMER_ID,
                  "X-Signature": sig
              }

          def get_competition(val):
              if val == "높음": return "🔴 높음"
              elif val == "중간": return "🟡 중간"
              else: return "🟢 낮음"

          def get_total(x):
              pc = x.get("monthlyPcQcCnt", 0)
              mobile = x.get("monthlyMobileQcCnt", 0)
              if isinstance(pc, str): pc = 0
              if isinstance(mobile, str): mobile = 0
              return int(pc) + int(mobile)

          def get_price(x):
              pc = x.get("pcClickPrice", 0)
              mobile = x.get("mobileClickPrice", 0)
              if isinstance(pc, str): pc = 0
              if isinstance(mobile, str): mobile = 0
              return max(int(pc), int(mobile))

          categories = {
              "여행": ["제주도여행", "국내여행추천", "해외여행", "당일치기여행", "강릉여행", "부산여행", "여행코스", "캠핑여행", "가족여행", "혼자여행"],
              "축제": ["지역축제", "봄축제", "음악축제", "불꽃축제", "벚꽃축제", "여름축제", "맥주축제", "문화축제", "야간축제", "체험축제"],
              "금융": ["주택담보대출", "신용대출금리", "적금추천", "예금금리", "신용카드추천", "청약통장", "ISA계좌", "연금저축", "개인연금", "체크카드추천"],
              "경제": ["부동산투자", "환율전망", "물가상승", "금리인하", "주택가격", "상업용부동산", "경제전망", "소비트렌드", "인플레이션", "재테크"],
              "주식": ["삼성전자주가", "국내주식추천", "ETF투자", "배당주추천", "코스피전망", "미국주식", "반도체주식", "성장주", "가치투자", "주식입문"],
              "방송": ["넷플릭스신작", "인기드라마", "예능프로그램", "OTT추천", "주말드라마", "웹드라마", "영화추천", "시즌제드라마", "범죄드라마", "로맨스드라마"],
              "상품": ["인기신상품", "쿠팡로켓배송", "오늘의특가", "무료배송상품", "해외직구추천", "가성비상품", "생활용품추천", "주방용품", "인테리어소품", "계절가전"],
              "뷰티": ["선크림추천", "기초화장품추천", "파운데이션추천", "스킨케어루틴", "향수추천", "클렌징추천", "세럼추천", "토너패드", "비비크림", "립스틱추천"],
              "패션": ["봄코디추천", "남자코디", "여자코디", "신발추천", "가방추천", "명품브랜드", "캐주얼패션", "오피스룩", "데이트룩", "스트릿패션"],
              "맛집": ["서울맛집추천", "부산맛집", "제주맛집", "강남맛집", "홍대맛집", "오마카세추천", "브런치카페", "배달맛집", "혼밥맛집", "데이트맛집"]
          }

          message_text = f"📊 오늘의 네이버 핫 키워드\n({datetime.now().strftime('%Y-%m-%d')})\n\n"

          for category, hints in categories.items():
              hint_str = ",".join(hints[:5])
              res = requests.get(
                  f"https://api.naver.com/keywordstool?hintKeywords={hint_str}&showDetail=1",
                  headers=get_ad_headers()
              )
              data = res.json()
              items = data.get("keywordList", [])
              items.sort(key=get_total, reverse=True)
              top_items = items[:10]

              message_text += f"🔹 {category} TOP 10\n"
              for item in top_items:
                  name = item.get("relKeyword", "")
                  total = get_total(item)
                  competition = get_competition(item.get("compIdx", "낮음"))
                  price = get_price(item)
                  message_text += f"  • {name}\n    🔍 {total:,}회 | 💥 {competition} | 💰 {price:,}원\n"
              message_text += "\n"
              time.sleep(0.5)

          token = "${{ secrets.TELEGRAM_TOKEN }}"
          chat_id = "${{ secrets.CHAT_ID }}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"

          chunk_size = 4000
          for i in range(0, len(message_text), chunk_size):
              chunk = message_text[i:i+chunk_size]
              requests.post(url, json={"chat_id": chat_id, "text": chunk})
              time.sleep(1)

          print("전송 완료!")
          EOF
