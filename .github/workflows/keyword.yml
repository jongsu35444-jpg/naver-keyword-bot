name: Naver Keyword Bot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  send-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Run keyword bot
        run: |
          pip install requests
          python - <<'EOF'
          import requests
          import time
          from datetime import datetime

          CLIENT_ID = "${{ secrets.NAVER_CLIENT_ID }}"
          CLIENT_SECRET = "${{ secrets.NAVER_CLIENT_SECRET }}"

          headers = {
              "X-Naver-Client-Id": CLIENT_ID,
              "X-Naver-Client-Secret": CLIENT_SECRET
          }

          res = requests.get(
              "https://openapi.naver.com/v1/search/news.json?query=여행&display=5&sort=date",
              headers=headers
          )
          print("상태코드:", res.status_code)
          print("응답내용:", res.text[:500])
          EOF
