name: Naver Keyword Bot

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  send-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Run keyword bot
        run: |
          pip install requests
          python - <<'EOF'
          import requests
          import time
          import hmac
          import hashlib
          import base64
          from datetime import datetime
          from collections import Counter
          import re

          CLIENT_ID = "${{ secrets.NAVER_CLIENT_ID }}"
          CLIENT_SECRET = "${{ secrets.NAVER_CLIENT_SECRET }}"
          ACCESS_LICENSE = "${{ secrets.NAVER_AD_LICENSE }}"
          SECRET_KEY = "${{ secrets.NAVER_AD_SECRET }}"
          CUSTOMER_ID = "${{ secrets.NAVER_CUSTOMER_ID }}"

          def get_ad_headers():
              timestamp = str(int(time.time() * 1000))
              path = "/keywordstool"
              method = "GET"
              msg = f"{timestamp}.{method}.{path}"
              signature = hmac.new(SECRET_KEY.encode(), msg.encode(), hashlib.sha256)
              sig = base64.b64encode(signature.digest()).decode()
              return {
                  "X-Timestamp": timestamp,
                  "X-API-KEY": ACCESS_LICENSE,
                  "X-Customer": CUSTOMER_ID,
                  "X-Signature": sig
              }

          def get_competition(val):
              if val == "높음": return "🔴 높음"
              elif val == "중간": return "🟡 중간"
              else: return "🟢 낮음"

          news_headers = {
              "X-Naver-Client-Id": CLIENT_ID,
              "X-Naver-Client-Secret": CLIENT_SECRET
          }

          categories = {
              "여행": ["국내여행", "해외여행", "여행코스", "당일치기", "여행지추천"],
              "축제": ["축제", "지역축제", "봄축제", "여름축제", "문화축제"],
              "금융": ["대출", "적금", "예금", "신용카드", "금리"],
              "경제": ["부동산", "환율", "물가", "경기침체", "소비"],
              "주식": ["주식투자", "코스피", "ETF", "배당주", "종목추천"],
              "방송": ["드라마", "예능", "넷플릭스", "OTT", "영화"],
              "상품": ["신상품", "할인", "쿠팡", "쇼핑", "무료배송"],
              "뷰티": ["화장품", "스킨케어", "뷰티", "선크림", "립스틱"],
              "패션": ["패션", "봄옷", "신발", "가방", "코디"],
              "맛집": ["맛집", "카페", "음식", "배달", "브런치"]
          }

          stopwords = {"있다","없다","이번","지난","올해","최근","대한","위한","통해","함께","대해","오늘","내일","이후","이전","관련","개최","진행","예정","발표","공개","기자","뉴스","통신","사진","제공","기사","억원","만원"}

          message_text = f"📊 오늘의 네이버 핫 키워드\n({datetime.now().strftime('%Y-%m-%d')})\n\n"

          for category, hints in categories.items():
              all_keywords = []
              for q in hints:
                  res = requests.get(
                      f"https://openapi.naver.com/v1/search/news.json?query={q}&display=20&sort=date",
                      headers=news_headers
                  )
                  data = res.json()
                  for item in data.get("items", []):
                      title = re.sub(r'<[^>]+>', '', item.get("title", ""))
                      words = re.findall(r'[가-힣]{2,8}', title)
                      all_keywords.extend(words)
                  time.sleep(0.2)

              filtered = [w for w in all_keywords if w not in stopwords]
              top_keywords = [kw for kw, _ in Counter(filtered).most_common(5)]

              if top_keywords:
                  hint_str = ",".join(top_keywords)
                  ad_res = requests.get(
                      f"https://api.naver.com/keywordstool?hintKeywords={hint_str}&showDetail=1",
                      headers=get_ad_headers()
                  )
                  ad_data = ad_res.json()
                  items = ad_data.get("keywordList", [])

                  def get_total(x):
                      pc = x.get("monthlyPcQcCnt", 0)
                      mobile = x.get("monthlyMobileQcCnt", 0)
                      if isinstance(pc, str): pc = 0
                      if isinstance(mobile, str): mobile = 0
                      return int(pc) + int(mobile)

                  items.sort(key=get_total, reverse=True)
                  top_items = items[:10]

                  message_text += f"🔹 {category} TOP 10\n"
                  for item in top_items:
                      name = item.get("relKeyword", "")
                      total = get_total(item)
                      competition = get_competition(item.get("compIdx", "낮음"))
                      message_text += f"  • {name}\n    🔍 {total:,}회 | 💥 경쟁: {competition}\n"
                  message_text += "\n"
                  time.sleep(0.5)

          token = "${{ secrets.TELEGRAM_TOKEN }}"
          chat_id = "${{ secrets.CHAT_ID }}"
          url = f"https://api.telegram.org/bot{token}/sendMessage"

          chunk_size = 4000
          for i in range(0, len(message_text), chunk_size):
              chunk = message_text[i:i+chunk_size]
              requests.post(url, json={"chat_id": chat_id, "text": chunk})
              time.sleep(1)

          print("전송 완료!")
          EOF
